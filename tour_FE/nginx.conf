# 브라우저 주소창 이동(text/html) vs fetch(JSON API) 구분
map $http_accept $hyland_spa_nav {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # public/sports/*.jpg — API /sports 와 경로 겹침
    location ~ ^/sports/.+\.(jpg|jpeg|png|webp|gif|svg|ico)$ {
        try_files $uri =404;
    }

    # FE 라우트와 API GET 경로가 겹치는 URL — 브라우저 이동(text/html)은 SPA, fetch/XHR는 API
    location ~ ^/(islands|sports|missions|leaderboard|community)(/|$) {
        if ($hyland_spa_nav = 1) {
            rewrite ^ /index.html break;
        }
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|bti|visits|profile|weather|leisure-sports|submissions|notifications|api|health) {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
