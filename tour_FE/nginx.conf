# HYland EC2 — HTTP(ACME·리다이렉트) + HTTPS(SPA·API 프록시)
# 인증서: /etc/letsencrypt/live/<HYLAND_SSL_CERT_NAME>/ (호스트에서 certbot 후 web 컨테이너에 ro 마운트)

map $http_accept $hyland_spa_nav {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name icnsumleisurenuri.com www.icnsumleisurenuri.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name icnsumleisurenuri.com www.icnsumleisurenuri.com;

    ssl_certificate /etc/letsencrypt/live/icnsumleisurenuri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icnsumleisurenuri.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HylandSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/hyland-app-locations.inc;
}
